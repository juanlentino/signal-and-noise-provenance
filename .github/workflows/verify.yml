name: Verify public provenance

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# contents: write for exactly one step: committing the rebuilt index.json when
# a Worker record commit outran it (the index is a DERIVED artifact, rebuilt
# deterministically from committed files — offline, no live-site dependency).
permissions:
  contents: write

# A backfill can publish many immutable records in quick succession. Keep only
# the newest verification for a branch; the scheduled run remains an
# independent full-ledger check.
concurrency:
  group: provenance-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A bot challenge cannot be reproduced from a residential IP — it is
    # ASN-based — so the only way to hold a REAL interstitial rather than one
    # hand-written from a log line is for CI to keep the one it was served.
    env:
      SN_CHALLENGE_CAPTURE_DIR: ${{ github.workspace }}/.challenge-evidence
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Self-heal (2026-07-29): the Worker commits records but never index
      # rows, so every new anchor used to red the coverage guard until a
      # human ran build-index (two rows drifted unseen Jul 25-28). Rebuild
      # the index and, on main only, push it ([skip ci]: THIS run then
      # verifies the healed tree and its verdict attaches to the record
      # push). Rebased push tolerates a Worker commit racing in between;
      # index.json has a single writer (this step + humans), so conflicts
      # cannot occur on it.
      #
      # NOT offline (corrected 2026-08-02 — the old comment claimed it was,
      # which is why an edge failure here read as inexplicable): the step
      # makes 1 + N live calls to juanlentino.com, because the set of PUBLIC
      # notes is only knowable from the site and comparing it against the
      # ledger IS the reverse-coverage guard. Those calls go through
      # fetch-site.mjs, which validates the payload shape and reports the
      # status, content-type and cf-ray when the edge intercepts.
      - name: Rebuild coverage index from committed records
        run: node scripts/build-index.mjs
      - name: Push the healed index (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet index.json; then
            echo "index already current"
            exit 0
          fi
          git config user.name "sn-ledger-verify"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "index: rebuild after record commit [skip ci]"
          git pull --rebase origin main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main
      - run: npm test
      - run: npm run verify:records
      - run: npm run verify:genesis
      - run: npm run verify:keys
      - run: npm run verify:key-pins
      - run: npm run verify:coverage
      - run: npm run verify:pages
      # `npm test` reports "N passed | 12 skipped". Those 12 are the live-PHP
      # cross-checks, which need the plugin source and are absent here BY
      # DESIGN. Assert that is the ONLY reason anything skipped: without this,
      # a broken guard could silently skip real tests and the run would still
      # read as green.
      - name: Assert the only skipped tests are the PHP-oracle cross-checks
        run: |
          npx vitest run --reporter=json --outputFile=.vitest.json >/dev/null 2>&1 || true
          node -e '
            const r = require("./.vitest.json");
            const skipped = r.testResults.flatMap(f => f.assertionResults)
              .filter(t => t.status === "pending" || t.status === "skipped");
            const stray = skipped.filter(t => !/live PHP|sample payload/.test(t.fullName ?? t.title));
            console.log(`${skipped.length} skipped, all PHP-oracle: ${stray.length === 0}`);
            if (stray.length) {
              console.error("Unexpected skipped tests:\n  " + stray.map(t => t.fullName ?? t.title).join("\n  "));
              process.exit(1);
            }
          '
      # Kept whatever the outcome: a GREEN run that absorbed a challenge is the
      # evidence that the retry works, and it is lost if we only keep failures.
      - name: Keep any bot-challenge bodies the edge served
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: challenge-evidence-${{ github.run_id }}
          path: .challenge-evidence/
          if-no-files-found: ignore
          retention-days: 30
