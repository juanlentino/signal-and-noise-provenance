name: Verify public provenance

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# contents: write for exactly one step: committing the rebuilt index.json when
# a Worker record commit outran it (the index is a DERIVED artifact, rebuilt
# from committed records and the live note and page lists).
permissions:
  contents: write

# A backfill can publish many immutable records in quick succession. Keep only
# the newest verification for a branch; the scheduled run remains an
# independent full-ledger check.
concurrency:
  group: provenance-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A bot challenge cannot be reproduced from a residential IP — it is
    # ASN-based — so the only way to hold a REAL interstitial rather than one
    # hand-written from a log line is for CI to keep the one it was served.
    # NOT a dotted directory: actions/upload-artifact defaults
    # include-hidden-files to false and silently skips anything whose path has
    # a dot-prefixed segment. The first real capture (run 30775546845) wrote
    # its file and the upload step still reported success with nothing in it.
    env:
      SN_CHALLENGE_CAPTURE_DIR: ${{ github.workspace }}/challenge-evidence
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Is this the Worker's own record push?
      #
      # Such a push lands SECONDS after the edit that triggered it, so the page
      # cache has provably not propagated yet. That one condition — and only
      # that one — is tolerated by verify:pages below. Every other trigger,
      # including the daily schedule, verifies with nothing tolerated. Content
      # drift still fails here, immediately: tampering gets no settling window.
      #
      # The message, not the author: the Worker commits under the owner's name
      # (a PAT), so github.actor cannot tell a record push from a hand push.
      #
      # HEAD_MSG is read through env and never interpolated into the script
      # body — a commit message is attacker-controllable text, and putting it
      # directly in `run:` is the classic Actions script-injection sink.
      #
      # Does this run read the live site? (2026-10-11)
      #
      # Only a push to main, the daily schedule and a manual dispatch fetch
      # juanlentino.com. A live run makes about 145 site fetches, and on
      # 2026-10-05 the 58 branch and PR runs made 8,659 of them, enough to
      # dominate the site's machine-reader counts. Branch, PR and tag runs
      # verify the committed files with every offline check; the live checks
      # run once the change lands on main.
      - name: Classify the trigger
        id: trigger
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] \
             && printf '%s' "$HEAD_MSG" | grep -qE '^provenance: [0-9a-f-]{36} v[0-9]+'; then
            echo "record_push=true" >> "$GITHUB_OUTPUT"
            echo "Worker record push — verify:pages tolerates a PROVEN-stale edge (origin must still match)."
          else
            echo "record_push=false" >> "$GITHUB_OUTPUT"
            echo "Not a record push — verifying with nothing tolerated."
          fi
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] \
             || { [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            echo "live_site=true" >> "$GITHUB_OUTPUT"
            echo "Live run: build-index, verify:key-pins, verify:coverage and verify:pages read juanlentino.com."
          else
            echo "live_site=false" >> "$GITHUB_OUTPUT"
            echo "Offline run ($EVENT_NAME on $GITHUB_REF): no site fetches, and verify:coverage runs with --offline."
          fi
      # Self-heal (2026-07-29): the Worker commits records but never index
      # rows, so every new anchor used to red the coverage guard until a
      # human ran build-index (two rows drifted unseen Jul 25-28). Rebuild
      # the index and, on main only, push it ([skip ci]: THIS run then
      # verifies the healed tree and its verdict attaches to the record
      # push). Rebased push tolerates a Worker commit racing in between;
      # index.json has a single writer (this step + humans), so conflicts
      # cannot occur on it.
      #
      # NOT offline (corrected 2026-08-02 — the old comment claimed it was,
      # which is why an edge failure here read as inexplicable): the step
      # makes 1 + N live calls to juanlentino.com, because the set of PUBLIC
      # notes is only knowable from the site and comparing it against the
      # ledger IS the reverse-coverage guard. Those calls go through
      # fetch-site.mjs, which validates the payload shape and reports the
      # status, content-type and cf-ray when the edge intercepts. Because it
      # is live, it runs only on a live run (see "Classify the trigger"); a
      # branch or PR run checks the committed index.json as it stands.
      - name: Rebuild coverage index from committed records
        if: steps.trigger.outputs.live_site == 'true'
        run: node scripts/build-index.mjs
      - name: Push the healed index (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet index.json; then
            echo "index already current"
            exit 0
          fi
          git config user.name "sn-ledger-verify"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "index: rebuild after record commit [skip ci]"
          git pull --rebase origin main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main
      - run: npm test
      - run: npm run verify:records
      - run: npm run verify:rights-signals
      - run: npm run verify:rights-evidence
      - run: npm run verify:genesis
      - run: npm run verify:keys
      # Live: the key mirror is fetched from the site.
      - if: steps.trigger.outputs.live_site == 'true'
        run: npm run verify:key-pins
      - run: npm run verify:retractions
      # On a branch or PR run, --offline still holds every index row to its
      # record and every record directory to an index row. Only the live note
      # list (one fetch) waits for main.
      - name: Verify coverage
        env:
          LIVE_SITE: ${{ steps.trigger.outputs.live_site }}
        run: |
          if [ "$LIVE_SITE" = "true" ]; then
            npm run verify:coverage
          else
            npm run verify:coverage -- --offline
          fi
      - run: npm run verify:countersignatures
      # weigh.mjs claims the same commit and the same policy give the same
      # bytes. Two runs and a cmp make that a guard instead of a sentence.
      - name: Weigh the key twice and compare
        run: |
          npm run --silent weigh -- --policy policy/example.json > "$RUNNER_TEMP/weigh-1.json"
          npm run --silent weigh -- --policy policy/example.json > "$RUNNER_TEMP/weigh-2.json"
          cmp "$RUNNER_TEMP/weigh-1.json" "$RUNNER_TEMP/weigh-2.json"
      # The ONLY step whose strictness depends on whether the push is a
      # record push. No other check can be legitimately wrong just because a
      # push is young, so none of them changes with it. Like every step that
      # reads the site, it runs only on a live run.
      - name: Verify served pages reproduce their records
        if: steps.trigger.outputs.live_site == 'true'
        env:
          RECORD_PUSH: ${{ steps.trigger.outputs.record_push }}
        run: |
          if [ "$RECORD_PUSH" = "true" ]; then
            npm run verify:pages -- --tolerate-stale-edge
          else
            npm run verify:pages
          fi
      # `npm test` reports "N passed | 12 skipped". Those 12 are the live-PHP
      # cross-checks, which need the plugin source and are absent here BY
      # DESIGN. Assert that is the ONLY reason anything skipped: without this,
      # a broken guard could silently skip real tests and the run would still
      # read as green.
      - name: Assert the only skipped tests are the PHP-oracle cross-checks
        run: |
          npx vitest run --reporter=json --outputFile=.vitest.json >/dev/null 2>&1 || true
          node -e '
            const r = require("./.vitest.json");
            const skipped = r.testResults.flatMap(f => f.assertionResults)
              .filter(t => t.status === "pending" || t.status === "skipped");
            const stray = skipped.filter(t => !/live PHP|sample payload/.test(t.fullName ?? t.title));
            console.log(`${skipped.length} skipped, all PHP-oracle: ${stray.length === 0}`);
            if (stray.length) {
              console.error("Unexpected skipped tests:\n  " + stray.map(t => t.fullName ?? t.title).join("\n  "));
              process.exit(1);
            }
          '
      # Kept whatever the outcome: a GREEN run that absorbed a challenge is the
      # evidence that the retry works, and it is lost if we only keep failures.
      # Gated with the live steps: an offline run asks the edge nothing.
      - name: Keep any bot-challenge bodies the edge served
        if: always() && steps.trigger.outputs.live_site == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: challenge-evidence-${{ github.run_id }}
          path: challenge-evidence/
          # 'ignore' is right — most runs are unchallenged and have nothing to
          # upload — but it is also what hid the misconfiguration above.
          if-no-files-found: ignore
          retention-days: 30
